<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title description">
  <title id="title">SecrétariatPro soutient Octobre Rose</title>
  <desc id="description">Affiche de sensibilisation au cancer du sein : en octobre, prenons soin les uns des autres. L’administratif se partage, la solidarité aussi.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#fff4f3"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff92b8"/>
      <stop offset=".55" stop-color="#ed4f8a"/>
      <stop offset="1" stop-color="#c9286b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e8f1ff"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#192b54" flood-opacity=".12"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#631d44" flood-opacity=".15"/>
    </filter>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#ea6e9a" opacity=".13"/>
    </pattern>
  </defs>

  <rect width="1080" height="1920" fill="url(#paper)"/>
  <path d="M0 0h1080v16H0z" fill="#142b59"/>
  <path d="M0 16h1080v7H0z" fill="#ec5a91"/>
  <circle cx="1015" cy="278" r="170" fill="#fae2eb" opacity=".55"/>
  <circle cx="57" cy="1026" r="220" fill="url(#dots)"/>
  <path d="M0 1480c210-100 340 48 522-8s338-136 558-4v460H0z" fill="#fce8ed" opacity=".66"/>

  <g aria-label="SecrétariatPro">
    <image href="/logo.png" x="84" y="76" width="124" height="124" preserveAspectRatio="xMidYMid meet"/>
    <text x="224" y="139" fill="#17336f" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="-2.7">Secrétariat<tspan fill="#2875f4">Pro</tspan></text>
    <text x="228" y="181" fill="#61708d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" letter-spacing="2.5">VOTRE PARTENAIRE ADMINISTRATIF</text>
  </g>

  <g transform="translate(84 252)">
    <rect width="298" height="54" rx="27" fill="#fbe3eb"/>
    <circle cx="28" cy="27" r="6" fill="#e64f87"/>
    <text x="49" y="35" fill="#a32c5a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" letter-spacing="2.2">OCTOBRE ROSE</text>
  </g>

  <text x="78" y="432" fill="#17336f" font-family="Arial, Helvetica, sans-serif" font-size="79" font-weight="800" letter-spacing="-3.8">En octobre,</text>
  <text x="78" y="524" fill="#17336f" font-family="Arial, Helvetica, sans-serif" font-size="79" font-weight="800" letter-spacing="-3.8">prenons soin</text>
  <text x="78" y="616" fill="#17336f" font-family="Arial, Helvetica, sans-serif" font-size="79" font-weight="800" letter-spacing="-3.8">les uns des autres.</text>
  <path d="M82 652c137 10 315 8 490-2" fill="none" stroke="#ec5a91" stroke-width="8" stroke-linecap="round"/>

  <text x="84" y="724" fill="#4d5b76" font-family="Arial, Helvetica, sans-serif" font-size="29">
    <tspan x="84" dy="0">SecrétariatPro se mobilise pour la</tspan>
    <tspan x="84" dy="43">sensibilisation au cancer du sein.</tspan>
  </text>
  <text x="84" y="842" fill="#17336f" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">
    <tspan x="84" dy="0">L’administratif se partage.</tspan>
    <tspan x="84" dy="39">La solidarité aussi.</tspan>
  </text>

  <g transform="translate(650 735)" filter="url(#softShadow)">
    <circle cx="160" cy="163" r="184" fill="#fbe1e9"/>
    <circle cx="160" cy="163" r="150" fill="#fff7f7"/>
    <path d="M171 57c-25-40-90-32-98 15-6 37 22 62 51 94l78 83 24-23-83-94c-21-24-42-41-38-60 4-19 28-25 43-6l22-9Zm-3 54 82 95c15 17 18 33 10 44-8 12-27 13-42-3l-21 20c32 35 78 34 100 2 22-32 8-65-17-94l-85-97-27 33Z" fill="url(#pink)"/>
    <path d="M109 151 34 266l35 17 76-113zM255 222l67 69 22-32-62-67z" fill="#dc3b7c"/>
    <path d="M240 60c12 9 22 22 30 39" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".72"/>
    <circle cx="67" cy="77" r="8" fill="#ef75a0"/>
    <circle cx="290" cy="111" r="6" fill="#ef75a0"/>
    <path d="M317 66l9 15 17 3-12 12 3 17-16-8-15 8 3-17-12-12 17-3z" fill="#f3b44e" opacity=".9"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="93" y="1041" width="894" height="493" rx="34" fill="#fff" stroke="#f0dce3" stroke-width="2"/>
    <rect x="139" y="1087" width="802" height="326" rx="22" fill="#17336f"/>
    <rect x="156" y="1104" width="768" height="292" rx="14" fill="url(#screen)"/>
    <rect x="185" y="1133" width="710" height="46" rx="12" fill="#fff" stroke="#e4eaf5"/>
    <circle cx="211" cy="1156" r="8" fill="#ef75a0"/>
    <path d="M236 1156h183" stroke="#d4ddeb" stroke-width="9" stroke-linecap="round"/>
    <rect x="185" y="1202" width="314" height="165" rx="17" fill="#fff" stroke="#e1e8f4"/>
    <text x="211" y="1242" fill="#596781" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">VOTRE SEMAINE</text>
    <path d="M211 1275h244M211 1314h195M211 1343h222" stroke="#e0e7f2" stroke-width="9" stroke-linecap="round"/>
    <rect x="520" y="1202" width="375" height="165" rx="17" fill="#fff" stroke="#e1e8f4"/>
    <rect x="545" y="1227" width="60" height="60" rx="16" fill="#fde7ef"/>
    <path d="M565 1257l14 14 30-33" fill="none" stroke="#df4b83" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="626" y="1251" fill="#17336f" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Du temps pour</text>
    <text x="626" y="1281" fill="#17336f" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">ce qui compte.</text>
    <path d="M78 1414h924l-48 54H126z" fill="#d9e1ef"/>
    <path d="M405 1416h270l-23 25H428z" fill="#c1cde0"/>
    <rect x="448" y="1470" width="185" height="8" rx="4" fill="#bac6d9"/>
  </g>

  <g transform="translate(118 1610)">
    <circle cx="30" cy="26" r="26" fill="#e7efff"/>
    <path d="M20 35V19l10-8 10 8v16H20Zm-5-15 15-12 15 12" fill="none" stroke="#2456a6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="22" fill="#17336f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800">Un geste de soutien</text>
    <text x="74" y="53" fill="#596781" font-family="Arial, Helvetica, sans-serif" font-size="21">commence par l’écoute et l’information.</text>
  </g>

  <g transform="translate(118 1725)">
    <path d="M26 28c0-17 13-30 30-30 11 0 20 5 25 14 5-9 14-14 25-14 17 0 30 13 30 30 0 34-55 66-55 66S26 62 26 28Z" transform="translate(0 0) scale(.62)" fill="#ed5a91"/>
    <text x="104" y="22" fill="#a32c5a" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800">Prenons soin de nous.</text>
    <text x="104" y="53" fill="#a32c5a" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800">Prenons soin les uns des autres.</text>
  </g>

  <path d="M84 1833h912" stroke="#e7cbd5" stroke-width="2"/>
  <text x="84" y="1874" fill="#65718a" font-family="Arial, Helvetica, sans-serif" font-size="17">
    Informez-vous auprès des sources de santé officielles.
  </text>
  <text x="996" y="1874" text-anchor="end" fill="#17336f" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800">
    SecrétariatPro · Octobre Rose
  </text>
</svg>
